[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tmtcode"
version = "0.1.0"
description = "A CLI coding agent that works on whichever project directory you run it in."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "Liam" }]
keywords = ["cli", "agent", "coding-assistant"]
# The agent itself needs nothing beyond the standard library. requests and rich
# only add live streaming and colour, and TMT falls back without them.
dependencies = []

[project.optional-dependencies]
live = ["requests", "rich"]

[project.urls]
Homepage = "https://github.com/lllons/TMT"

# The command this project exists to provide. Installing puts `tmtcode` on PATH,
# so the agent can be started from any project without that project needing to
# know where TMT itself lives.
[project.scripts]
tmtcode = "TMT:main"

[tool.setuptools]
# Flat modules rather than a package, matching how the project is laid out.
py-modules = [
    "TMT",
    "agent_actions",
    "agent_commands",
    "agent_config",
    "agent_credentials",
    "agent_execution",
    "agent_file_ops",
    "agent_git",
    "agent_index",
    "agent_live_renderer",
    "agent_manager",
    "agent_memory",
    "agent_menu",
    "agent_model",
    "agent_models",
    "agent_panel",
    "agent_plan",
    "agent_prompt",
    "agent_providers",
    "agent_review",
    "agent_session",
    "agent_subprompts",
    "agent_setup",
    "agent_symbols",
    "agent_testsel",
    "agent_tree",
    "agent_ui",
    "agent_verify",
    "agent_verify_discovery",
    "agent_verify_engine",
    "agent_worker",
]

# The suite lives under testing/ and is run with `python run_tests.py`, which
# needs no configuration. This section is for pytest, which can also collect
# the same files -- and which would otherwise put only `testing/unit` on
# sys.path and fail to import a single agent module.
[tool.pytest.ini_options]
pythonpath = [".", "testing/unit", "testing/integration"]
testpaths = ["testing"]
